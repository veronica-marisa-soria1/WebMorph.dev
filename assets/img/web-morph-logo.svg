<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title desc">
  <title id="title">Logo Web Morph</title>
  <desc id="desc">Monograma WM con parentesis de codigo y una linea fluida que representa transformacion digital.</desc>
  <defs>
    <linearGradient id="edge" x1="12" y1="12" x2="84" y2="84" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9DEBFF"/>
      <stop offset="0.52" stop-color="#245BFF"/>
      <stop offset="1" stop-color="#31F6C8"/>
    </linearGradient>
    <linearGradient id="stroke" x1="20" y1="26" x2="76" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9DEBFF"/>
      <stop offset="0.48" stop-color="#245BFF"/>
      <stop offset="1" stop-color="#31F6C8"/>
    </linearGradient>
    <filter id="glow" x="-24" y="-24" width="144" height="144" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#245BFF" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#31F6C8" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="96" height="96" rx="22" fill="#0B1018"/>
  <rect x="9" y="9" width="78" height="78" rx="18" fill="#141B2A" stroke="url(#edge)" stroke-width="3"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M29 31L18 48L29 65" stroke="#9DEBFF" stroke-width="6" opacity="0.9"/>
    <path d="M67 31L78 48L67 65" stroke="#31F6C8" stroke-width="6" opacity="0.9"/>
    <path
      d="M29 65L37 32L48 56L59 32L67 65"
      stroke="url(#stroke)"
      stroke-width="7"
      filter="url(#glow)"
    />
    <path d="M34 48C42 39 54 57 62 48" stroke="#F2FBFF" stroke-width="3" opacity="0.78"/>
  </g>

  <circle cx="37" cy="32" r="3.5" fill="#9DEBFF"/>
  <circle cx="48" cy="56" r="3.5" fill="#245BFF"/>
  <circle cx="59" cy="32" r="3.5" fill="#31F6C8"/>
</svg>
